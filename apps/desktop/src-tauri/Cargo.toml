[package]
name = "nisar-surface-change-monitor"
version = "0.4.0"
description = "NISAR Surface Change Monitor"
authors = ["The Cartographers"]
license = "MIT"
edition = "2021"

[lib]
name = "nisar_surface_change_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tiff = "0.9"
