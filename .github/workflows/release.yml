name: Release

# Builds unsigned Tauri installers for Windows, macOS and Linux whenever a
# tag starting with "v" is pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`),
# and uploads them to a draft GitHub Release for manual review and publishing.
#
# The Tauri shell lives in apps/desktop; its tauri.conf.json builds the
# frontend from apps/web (pnpm --filter web build) before bundling.
#
# The draft release is created once, before the matrix starts, so the parallel
# builds all upload to the same release instead of racing to create their own.
#
# Map tiles (~480 MB) are not committed, so the installers stream them from a
# remote host. Set the repository variable TILE_BASE_URL (Settings -> Secrets and
# variables -> Actions -> Variables) to the public bucket URL, for example
# https://pub-<id>.r2.dev. It is baked into the frontend as VITE_TILE_BASE_URL.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release for this tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="NISAR Surface Change Monitor $TAG" \
              -f body="Download the installer for your system below, or use the Download page: https://drakaniia.github.io/Dancing_with_the_SARs/getting-started/download/" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tile host
        shell: bash
        env:
          TILE_BASE_URL: ${{ vars.TILE_BASE_URL }}
        run: |
          if [ -z "$TILE_BASE_URL" ]; then
            echo "::warning::TILE_BASE_URL is not set; installers will show blank map overlays."
          else
            echo "Tiles will load from $TILE_BASE_URL"
          fi

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_TILE_BASE_URL: ${{ vars.TILE_BASE_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
